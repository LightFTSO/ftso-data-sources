services:
  ftso-data-sources:
    container_name: ftso-data-sources
    image: ftso-data-sources:latest
    build: .
    restart: unless-stopped
    ports:
      - "9999:9999"
      - "9998:9998"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      - ENV=production
    networks:
      - ftso-data-sources
  valkey-ts:
    build:
      context: ./deploy/valkey  # <--- Points to the subfolder
    container_name: valkey-ts
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    command: >
      valkey-server
      --loadmodule /usr/lib/valkey/modules/timeseries.so
      --save ""
      --appendonly no 
      --loglevel notice
      --protected-mode no
      --stop-writes-on-bgsave-error no
      --tcp-keepalive 60
      --timeout 0
      --maxmemory-policy allkeys-lru
      --databases 1
      --io-threads 4
    networks:
      - ftso-data-sources

  # 3. Web UI
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    depends_on:
      valkey-ts:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
    networks:
      - ftso-data-sources

volumes:
  valkey_data:
  redisinsight_data:

networks:
  ftso-data-sources: